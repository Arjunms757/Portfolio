<div class="preloader" *ngIf="loading" [class.fading-out]="isFadingOut">
  <div class="preloader-ambient-glow"></div>

  <div class="minimal-loader-container">
    <!-- Sequential Skill Icons Row (Appearing as progress increases) -->
    <div class="skills-progress-row">
      <div 
        class="skill-node" 
        *ngFor="let skill of skills"
        [class.active]="progress >= skill.threshold"
        [style.--skill-color]="skill.color"
        [style.--skill-glow]="skill.glow"
        [attr.title]="skill.name">
        <div class="skill-icon-wrapper" *ngIf="progress >= skill.threshold">
          <img [src]="skill.icon" [alt]="skill.name" width="24" height="24">
        </div>
      </div>
    </div>

    <!-- Telemetry Status Message -->
    <div class="loader-telemetry">
      <span class="prompt-arrow">&gt;</span>
      <span class="status-message">{{ statusText }}</span>
      <span class="cursor-blink">_</span>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill" [style.width.%]="progress">
        <div class="progress-glow-head"></div>
      </div>
    </div>

    <!-- Progress Meta Info -->
    <div class="progress-meta">
      <span class="progress-label">INITIALIZING ECOSYSTEM</span>
      <span class="progress-pct">{{ progress }}%</span>
    </div>
  </div>
</div>

<div class="app-content" [class.visible]="!loading">
  <app-header></app-header>
  <main>
    <app-hero></app-hero>
    <app-about></app-about>
    <app-experience></app-experience>
    <app-projects></app-projects>
  </main>
  <app-footer></app-footer>
  <app-contact></app-contact>
</div>
